name: Generate Instagram images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout config
        uses: actions/checkout@v4

      - name: Checkout viewer
        uses: actions/checkout@v4
        with:
          repository: MaximilianKleissl/wvv-insta-posts
          ref: main
          path: viewer

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: viewer/package-lock.json

      - name: Install viewer dependencies
        working-directory: viewer
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: viewer
        run: npx playwright install --with-deps chromium

      - name: Select previous, current, and next weekends
        id: select-weekends
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const overview = JSON.parse(fs.readFileSync('Spiele/File_Overview.json', 'utf8'));
          const matchDays = overview
            .filter((file) => file !== 'metadata.json' && file !== 'File_Overview.json')
            .flatMap((file) => JSON.parse(fs.readFileSync(path.join('Spiele', file), 'utf8')));

          const weekStart = (date) => {
            const monday = new Date(date);
            monday.setUTCDate(monday.getUTCDate() - ((monday.getUTCDay() + 6) % 7));
            return monday.toISOString().slice(0, 10);
          };
          const parseGermanDate = (value) => {
            const match = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(value?.trim() ?? '');
            if (!match) return null;
            const [, day, month, year] = match;
            const date = new Date(Date.UTC(Number(year), Number(month) - 1, Number(day)));
            if (date.getUTCDate() !== Number(day) || date.getUTCMonth() !== Number(month) - 1) return null;
            return date;
          };

          const berlinToday = new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Europe/Berlin',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
          }).format(new Date());
          const today = new Date(`${berlinToday}T00:00:00Z`);
          const currentWeek = new Date(`${weekStart(today)}T00:00:00Z`);
          const wantedWeeks = [-7, 0, 7].map((offset) => {
            const date = new Date(currentWeek);
            date.setUTCDate(date.getUTCDate() + offset);
            return date.toISOString().slice(0, 10);
          });
          const allWeeks = [...new Set(matchDays.map((matchDay) => {
            const date = parseGermanDate(matchDay.date);
            return date ? weekStart(date) : matchDay.date;
          }))].sort();
          const indexes = allWeeks
            .map((week, index) => wantedWeeks.includes(week) ? index : -1)
            .filter((index) => index >= 0)
            .join(',');
          const groups = wantedWeeks.map((week, position) => ({
            label: ['Letzte Woche', 'Aktuelle Woche', 'Nächste Woche'][position],
            weekStart: week,
            weekendIndex: allWeeks.indexOf(week),
          })).map((group) => ({
            ...group,
            weekendIndex: group.weekendIndex < 0 ? null : group.weekendIndex,
          }));

          console.log(`Berlin date: ${berlinToday}`);
          console.log(`Selected week starts: ${wantedWeeks.join(', ')}`);
          console.log(`Export weekend indexes: ${indexes || '(none)'}`);
          fs.writeFileSync('viewer/weekend-groups.json', JSON.stringify(groups, null, 2));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `indexes=${indexes}\n`);
          NODE

      - name: Build viewer with this config commit
        working-directory: viewer
        env:
          VITE_CONFIG_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}
        run: npm run build

      - name: Export images
        working-directory: viewer
        env:
          BASE_URL: http://127.0.0.1:4173/wvv-insta-posts/
          ONLY_WEEKENDS: ${{ steps.select-weekends.outputs.indexes }}
        run: |
          rm -rf images
          mkdir -p images
          npm run serve -- --host 127.0.0.1 --port 4173 > /tmp/viewer-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 60); do
            if curl --fail --silent "$BASE_URL" > /dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat /tmp/viewer-preview.log
              exit 1
            fi
            sleep 2
          done

          if [ -n "$ONLY_WEEKENDS" ]; then
            npx --yes tsx@4.19.3 scripts/export-slides.ts --only-weekends="$ONLY_WEEKENDS" --format=portrait_4by5 --pixel-ratio=2 --image-format=jpeg
            npx --yes tsx@4.19.3 scripts/export-slides.ts --only-weekends="$ONLY_WEEKENDS" --format=stories --pixel-ratio=2 --image-format=jpeg
          else
            echo "No matchdays in the previous, current, or next weekend; skipping PNG export."
          fi

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const files = fs.readdirSync('images').filter((file) => file.endsWith('.jpg'));
          if (process.env.ONLY_WEEKENDS && files.length === 0) {
            throw new Error('Weekend indexes were selected, but no JPEGs were exported.');
          }
          for (const file of files) {
            const data = fs.readFileSync(path.join('images', file));
            if (data[0] !== 0xff || data[1] !== 0xd8) throw new Error(`${file}: not a JPEG`);
            let offset = 2;
            let dimensions;
            while (offset < data.length) {
              if (data[offset] !== 0xff) throw new Error(`${file}: malformed JPEG marker`);
              while (data[offset] === 0xff) offset++;
              const marker = data[offset++];
              if (marker === 0xd9 || marker === 0xda) break;
              if (marker === 0x01 || (marker >= 0xd0 && marker <= 0xd7)) continue;
              const segmentLength = data.readUInt16BE(offset);
              if ([0xc0, 0xc1, 0xc2, 0xc3, 0xc5, 0xc6, 0xc7, 0xc9, 0xca, 0xcb, 0xcd, 0xce, 0xcf].includes(marker)) {
                dimensions = `${data.readUInt16BE(offset + 5)}x${data.readUInt16BE(offset + 3)}`;
                break;
              }
              offset += segmentLength;
            }
            const actual = dimensions;
            const expected = file.endsWith('_stories.jpg') ? '2160x3840' : '2160x2700';
            if (actual !== expected) {
              throw new Error(`${file}: expected ${expected}, got ${actual}`);
            }
            console.log(`${file}: ${actual}`);
          }
          NODE

      - name: Create image gallery
        working-directory: viewer
        run: |
          export BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const groups = JSON.parse(fs.readFileSync('weekend-groups.json', 'utf8'));
          const files = fs.readdirSync('images').filter((file) => file.endsWith('.jpg'));
          const formatDate = (value) => new Intl.DateTimeFormat('de-DE', {
            day: '2-digit', month: '2-digit', year: 'numeric', timeZone: 'UTC',
          }).format(new Date(`${value}T00:00:00Z`));
          const sections = groups.map((group) => {
            const weekEnd = new Date(`${group.weekStart}T00:00:00Z`);
            weekEnd.setUTCDate(weekEnd.getUTCDate() + 6);
            const weekRange = `${formatDate(group.weekStart)}–${formatDate(weekEnd.toISOString().slice(0, 10))}`;
            const prefix = group.weekendIndex === null ? null : `wochenende_${group.weekendIndex + 1}_`;
            const groupFiles = prefix
              ? files.filter((file) => file.startsWith(prefix)).sort((a, b) => {
                  const aOverview = a.includes('_overview');
                  const bOverview = b.includes('_overview');
                  return aOverview === bOverview ? a.localeCompare(b) : aOverview ? -1 : 1;
                })
              : [];
            const portraits = groupFiles.filter((file) => !file.endsWith('_stories.jpg'));
            const cards = portraits.flatMap((file) => {
              const storyFile = file.replace(/\.jpg$/, '_stories.jpg');
              const title = file.replace(prefix, '').replace(/\.jpg$/, '').replace(/_/g, ' ');
              const items = [`<a class="image-card" data-format="portrait" href="${encodeURIComponent(file)}"><img class="portrait" src="${encodeURIComponent(file)}" alt="${title} – Portrait 4:5" loading="lazy"><span>${title} · Portrait 4:5</span></a>`];
              if (groupFiles.includes(storyFile)) {
                items.push(`<a class="image-card" data-format="stories" href="${encodeURIComponent(storyFile)}"><img class="story" src="${encodeURIComponent(storyFile)}" alt="${title} – Stories" loading="lazy"><span>${title} · Stories</span></a>`);
              }
              return items;
            }).join('\n');
            return `<section><div class="section-heading"><h2>${group.label}</h2><time>${weekRange}</time></div><main>${cards || '<p class="empty">Keine Bilder für diese Woche.</p>'}</main></section>`;
          }).join('\n');
          const builtAt = new Intl.DateTimeFormat('de-DE', {
            dateStyle: 'long', timeStyle: 'short', timeZone: 'Europe/Berlin',
          }).format(new Date(process.env.BUILD_TIMESTAMP));
          const page = `<!doctype html>
          <html lang="de">
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>WVV Instagram-Bilder</title>
            <style>
              body{margin:0;padding:2rem;font:16px system-ui,sans-serif;color:#17211d;background:#f4f5f2}
              h1{font-size:1.5rem;margin-bottom:.4rem}.updated{margin:0 0 1rem;color:#53615a;font-size:.9rem}
              .format-toggle{display:flex;gap:.4rem;margin:0 0 2rem}.format-toggle button{border:1px solid #9aa79e;background:#fff;color:#25342b;padding:.5rem .85rem;cursor:pointer;font:inherit}.format-toggle button[aria-pressed="true"]{background:#17633a;color:#fff;border-color:#17633a}
              section{margin:0 0 2.5rem}.section-heading{display:flex;align-items:baseline;gap:.8rem;flex-wrap:wrap;border-bottom:1px solid #cbd2cd;margin-bottom:1rem}
              h2{font-size:1.15rem;margin:.3rem 0 .7rem}.section-heading time{color:#53615a;font-size:.9rem}
              main{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1rem}
              [data-format="stories"]{display:none}.show-stories [data-format="portrait"]{display:none}.show-stories [data-format="stories"]{display:block}
              a{color:inherit;text-decoration:none}img{display:block;width:100%;object-fit:contain;background:#ddd}
              img.portrait{aspect-ratio:4/5}img.story{aspect-ratio:9/16}
              span{display:block;padding:.5rem 0;overflow-wrap:anywhere}.empty{color:#68756e}
            </style>
            <h1>WVV Instagram-Bilder</h1>
            <p class="updated">Zuletzt erstellt: <time datetime="${process.env.BUILD_TIMESTAMP}">${builtAt} Uhr</time></p>
            <div class="format-toggle" role="group" aria-label="Bildformat auswählen">
              <button type="button" data-select-format="portrait" aria-pressed="true">Portraits</button>
              <button type="button" data-select-format="stories" aria-pressed="false">Stories</button>
            </div>
            ${sections}
            <script>
              document.querySelectorAll('[data-select-format]').forEach((button) => {
                button.addEventListener('click', () => {
                  const stories = button.dataset.selectFormat === 'stories';
                  document.body.classList.toggle('show-stories', stories);
                  document.querySelectorAll('[data-select-format]').forEach((option) => {
                    option.setAttribute('aria-pressed', String(option === button));
                  });
                });
              });
            </script>
          </html>`;
          fs.writeFileSync('images/index.html', page);
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: viewer/images

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
